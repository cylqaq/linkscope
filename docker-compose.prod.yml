services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-linkscope-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkscope}
      POSTGRES_USER: ${POSTGRES_USER:-linkscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkscope}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-linkscope-redis}
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${API_IMAGE:-linkscope-api-ci}
    container_name: ${API_CONTAINER_NAME:-linkscope-api}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkscope}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-linkscope}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PORT: 3001
      WEB_URL: ${WEB_URL}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SCREENSHOT_DIR: /app/screenshots
    ports:
      - "${API_HOST_PORT:-3001}:3001"
    volumes:
      - screenshots:/app/screenshots
      - uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${WEB_IMAGE:-linkscope-web-ci}
    container_name: ${WEB_CONTAINER_NAME:-linkscope-web}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:3001/api
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"

volumes:
  postgres_data:
  redis_data:
  screenshots:
  uploads:
